# agent-node: проверка до слияния в agent/node.
#   linux   — сборка и тесты цепочки на процессоре с Qwen3.5-0.8B (tools/agent-node/tests/run.sh): пакеты сессий,
#             откат черновика, кэш разговора в serve; сборка для Linux — в артефакте
#   windows — сборка MSVC без CUDA: ловит ошибки, которые видит только компилятор Windows (сборка с CUDA и Vulkan
#             для участников — в основном репозитории, около часа)
name: agent-node

on:
  pull_request:
    branches: [agent/node]
    paths:
      - 'tools/agent-node/**'
      - 'src/**'
      - 'include/**'
      - 'common/**'
      - 'ggml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/agent-node.yml'
  push:
    branches: [agent/node]
    paths:
      - 'tools/agent-node/**'
      - 'src/**'
      - 'include/**'
      - 'common/**'
      - 'ggml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/agent-node.yml'
  workflow_dispatch:

concurrency:
  group: agent-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux — сборка и тесты цепочки
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Кэш компиляции
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: agent-node-linux
          evict-old-files: 7d

      - name: Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Сборка
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build -j "$(nproc)" --target agent-node

      - name: Модель для тестов
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3.5-0.8b-q8_0

      - name: Скачать модель (Qwen3.5-0.8B, 0,8 ГБ)
        run: |
          [ -f models/Qwen3.5-0.8B-Q8_0.gguf ] || curl -fL --retry 3 --create-dirs -o models/Qwen3.5-0.8B-Q8_0.gguf \
            https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q8_0.gguf

      - name: Тесты
        run: tools/agent-node/tests/run.sh build/bin/agent-node models/Qwen3.5-0.8B-Q8_0.gguf "$RUNNER_TEMP/agent-node-tests"

      - name: Журналы тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-node-tests-logs
          path: ${{ runner.temp }}/agent-node-tests
          retention-days: 7

      - name: Сборка для Linux
        uses: actions/upload-artifact@v4
        with:
          name: agent-node-linux-x64
          path: build/bin/agent-node
          retention-days: 14

  windows:
    name: Windows — сборка MSVC без CUDA
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Кэш компиляции
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: agent-node-windows-cpu
          evict-old-files: 7d

      - name: Ninja
        run: choco install ninja

      - name: Сборка
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          rem как в выпуске: процессорная часть — DLL по варианту на набор команд (GGML_CPU_ALL_VARIANTS);
          rem здесь — AVX2 (haswell) и AVX-512 VBMI + VNNI (icelake, с ядрами arch/x86/iq-avx512.h)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON ^
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_BORINGSSL=ON
          if errorlevel 1 exit /b 1
          cmake --build build -j %NUMBER_OF_PROCESSORS% --target agent-node ggml-cpu-haswell ggml-cpu-icelake
          if errorlevel 1 exit /b 1

      - name: Запуск
        shell: pwsh
        run: |
          # без аргументов agent-node печатает справку и выходит с ошибкой; важно, что он запускается
          $out = & build\bin\agent-node.exe 2>&1 | Out-String
          if ($out -notmatch 'usage:') { Write-Host $out; exit 1 }
          Write-Host 'agent-node.exe запускается'
          exit 0 # код выхода справки — не ошибка шага

      # ядра AVX-512 IQ2_XXS / IQ3_XXS против ядер ggml, если у сборщика AVX-512 VBMI + VNNI (иначе — вариант haswell)
      - name: Ядра IQ на процессоре сборщика
        shell: pwsh
        run: |
          $out = & build\bin\agent-node.exe bench-experts --threads 1,2 --tokens 1 --types iq2_xxs,iq2_xxs-ggml,iq3_xxs,iq3_xxs-ggml 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          "``````n$out``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($rc -ne 0) { throw "bench-experts: код $rc" }
          if ($out -match 'WRONG RESULT') { throw 'ядро AVX-512 считает не так, как ggml' }
          # процессор с VBMI и VNNI, а загружен вариант без ядер IQ512 — ошибка выбора варианта
          if ($out -match 'instructions of the CPU:.*VNNI-512 VBMI' -and $out -notmatch 'built for:.* IQ512') { throw 'у процессора есть AVX-512 VBMI + VNNI, а ядра IQ512 не загрузились' }
